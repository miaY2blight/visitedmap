<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Page</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
  }
  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 28px;
  }
  p {
    margin: 0;
    opacity: 0.7;
    font-size: 14px;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    padding: 6px 14px;
    border-radius: 999px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Test Page</h1>
    <p>これはテスト用の静的HTMLファイルです。</p>
    <span class="badge">STATIC / SINGLE FILE</span>
  </div>
</body>
</html>
